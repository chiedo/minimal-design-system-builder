<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design System Studio — palette, type, preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      :root {
        --ui-bg: #eceff3;
        --ui-panel: #ffffff;
        --ui-ink: #102a43;
        --ui-muted: #627d98;
        --ui-line: #d9e2ec;
        --ui-fill: #f0f4f8;
        --ui-accent: #243b53;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ui-ink);
        background: var(--ui-bg);
        font-size: 14px;
        line-height: 1.45;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.7rem 1rem;
        background: var(--ui-panel);
        border-bottom: 1px solid var(--ui-line);
      }

      .brand {
        display: flex;
        flex-direction: column;
        min-width: 12rem;
      }

      .brand strong {
        font-size: 0.95rem;
        letter-spacing: -0.02em;
      }

      .brand span {
        color: var(--ui-muted);
        font-size: 0.75rem;
      }

      .topbar-tabs,
      .stage-tabs {
        display: flex;
        gap: 0.25rem;
        background: var(--ui-fill);
        padding: 0.2rem;
        border-radius: 10px;
      }

      .topbar-tabs button,
      .stage-tabs button {
        border: 0;
        background: transparent;
        color: var(--ui-muted);
        padding: 0.4rem 0.75rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.82rem;
      }

      .topbar-tabs button[aria-selected="true"],
      .stage-tabs button[aria-selected="true"] {
        background: var(--ui-panel);
        color: var(--ui-ink);
        box-shadow: 0 0 0 1px var(--ui-line);
      }

      .top-actions {
        margin-left: auto;
        display: flex;
        gap: 0.4rem;
        align-items: center;
      }

      .top-actions button,
      .btn {
        border: 1px solid var(--ui-line);
        background: var(--ui-panel);
        border-radius: 8px;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.8rem;
      }

      .btn.primary,
      .top-actions .primary {
        background: var(--ui-accent);
        color: #fff;
        border-color: var(--ui-accent);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(22rem, 28rem) 1fr;
        min-height: 0;
      }

      .inspector {
        background: var(--ui-panel);
        border-right: 1px solid var(--ui-line);
        overflow: auto;
        padding: 1rem 1rem 2rem;
        min-height: 0;
      }

      .stage {
        overflow: auto;
        min-height: 0;
        padding: 1rem 1.1rem 2rem;
      }

      .hint {
        color: var(--ui-muted);
        font-size: 0.8rem;
        margin: 0 0 0.9rem;
      }

      .scale-list {
        display: grid;
        gap: 0.4rem;
        margin-bottom: 1rem;
      }

      .scale-btn {
        text-align: left;
        border: 1px solid var(--ui-line);
        background: var(--ui-panel);
        border-radius: 10px;
        padding: 0.4rem 0.55rem;
        cursor: pointer;
        width: 100%;
      }

      .scale-btn[aria-pressed="true"] {
        border-color: var(--ui-ink);
        box-shadow: 0 0 0 1px var(--ui-ink);
      }

      .scale-btn .row-name {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        font-size: 0.78rem;
        margin-bottom: 0.35rem;
      }

      .scale-btn .row-name em {
        font-style: normal;
        color: var(--ui-muted);
        font-weight: 500;
      }

      .mini-ramp {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 2px;
        height: 0.95rem;
      }

      .mini-ramp span {
        display: block;
        height: 100%;
      }

      .mini-ramp span:first-child {
        border-radius: 4px 0 0 4px;
      }

      .mini-ramp span:last-child {
        border-radius: 0 4px 4px 0;
      }

      .field {
        margin: 0 0 0.85rem;
      }

      .field-label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 0.3rem;
      }

      .field-label span {
        color: var(--ui-muted);
        font-weight: 600;
      }

      .slider-row {
        display: grid;
        grid-template-columns: 1fr 4.4rem;
        gap: 0.45rem;
        align-items: center;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--ui-accent);
      }

      .hue-range {
        appearance: none;
        height: 14px;
        border-radius: 99px;
        background: linear-gradient(
          to right,
          hsl(0 100% 50%),
          hsl(60 100% 50%),
          hsl(120 100% 50%),
          hsl(180 100% 50%),
          hsl(240 100% 50%),
          hsl(300 100% 50%),
          hsl(360 100% 50%)
        );
      }

      .hue-range::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #102a43;
      }

      .hue-range::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #102a43;
      }

      input[type="number"],
      input[type="text"],
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--ui-line);
        border-radius: 8px;
        padding: 0.4rem 0.5rem;
        background: #fff;
      }

      .hex-row {
        display: grid;
        grid-template-columns: 3rem 1fr auto;
        gap: 0.45rem;
        align-items: center;
      }

      input[type="color"] {
        width: 3rem;
        height: 2.4rem;
        padding: 0;
        border: 1px solid var(--ui-line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }

      .contrast {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 0.35rem 0.5rem;
        border-radius: 8px;
        white-space: nowrap;
      }

      .contrast.pass {
        background: #effcf6;
        color: #147d64;
      }

      .contrast.fail {
        background: #fff5f5;
        color: #9b2c2c;
      }

      .check {
        display: flex;
        gap: 0.45rem;
        align-items: flex-start;
        font-size: 0.8rem;
        margin: 0.4rem 0 0.9rem;
      }

      .section-title {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ui-muted);
        margin: 1.1rem 0 0.5rem;
        font-weight: 800;
      }

      .shade-picks {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 0.25rem;
        margin-bottom: 0.75rem;
      }

      .shade-picks button {
        border: 1px solid var(--ui-line);
        background: #fff;
        border-radius: 8px;
        padding: 0.15rem 0 0.3rem;
        cursor: pointer;
        font-size: 0.62rem;
        font-weight: 700;
      }

      .shade-picks button .dot {
        display: block;
        height: 1.15rem;
        margin: 0 0.2rem 0.2rem;
        border-radius: 4px;
      }

      .shade-picks button[aria-pressed="true"] {
        border-color: var(--ui-ink);
        box-shadow: 0 0 0 1px var(--ui-ink);
      }

      details.advanced {
        border: 1px solid var(--ui-line);
        border-radius: 10px;
        padding: 0.45rem 0.65rem 0.15rem;
        margin: 0.85rem 0;
        background: var(--ui-fill);
      }

      details.advanced summary {
        cursor: pointer;
        font-weight: 700;
        font-size: 0.78rem;
        margin-bottom: 0.35rem;
      }

      .font-option {
        padding: 0.15rem 0;
      }

      .type-specimen-mini {
        border: 1px solid var(--ui-line);
        border-radius: 10px;
        padding: 0.7rem 0.8rem;
        margin-bottom: 0.9rem;
        background: var(--ui-fill);
      }

      .export-box {
        width: 100%;
        min-height: 14rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.72rem;
        line-height: 1.4;
        white-space: pre;
      }

      .status {
        color: var(--ui-muted);
        font-size: 0.78rem;
        min-height: 1.2rem;
        margin-top: 0.6rem;
      }

      .stage-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.9rem;
      }

      .palette-board {
        display: grid;
        gap: 1.1rem;
      }

      .palette-scale h3 {
        margin: 0 0 0.45rem;
        font-size: 0.95rem;
      }

      .palette-scale p {
        margin: 0 0 0.55rem;
        color: var(--ui-muted);
        font-size: 0.78rem;
      }

      .swatch-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.45rem 0.55rem;
      }

      .swatch {
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }

      .swatch .chip {
        display: block;
        height: 3.4rem;
        border-radius: 8px;
        border: 1px solid rgb(16 42 67 / 8%);
      }

      .swatch[aria-pressed="true"] .chip {
        outline: 2px solid var(--ui-ink);
        outline-offset: 1px;
      }

      .swatch .meta {
        display: block;
        margin-top: 0.3rem;
        font-size: 0.68rem;
        line-height: 1.3;
        color: #334e68;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .swatch .meta b {
        display: block;
        font-family: inherit;
        color: var(--ui-ink);
      }

      .preview-frame {
        max-width: 56rem;
        margin: 0 auto;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--ui-line);
        background: var(--preview-bg, #f0f4f8);
      }

      .preview-root {
        color: var(--preview-text);
        font-family: var(--font-ui);
        background: var(--preview-bg);
        min-height: 36rem;
      }

      .preview-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.25rem;
        background: var(--preview-brand);
        color: var(--preview-brand-text);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .preview-nav {
        display: flex;
        gap: 1.1rem;
        align-items: center;
      }

      .preview-nav a {
        color: inherit;
        text-decoration: none;
      }

      .preview-nav a.is-current {
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      .preview-body {
        padding: 1.5rem 1.35rem 2rem;
        max-width: 44rem;
        margin: 0 auto;
      }

      .kicker {
        color: var(--preview-primary);
        font-size: var(--text-sm);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin: 0 0 0.35rem;
      }

      .preview-title {
        font-family: var(--font-display);
        font-size: var(--text-4xl);
        line-height: 1.15;
        letter-spacing: var(--track-display);
        font-weight: var(--weight-display);
        margin: 0 0 0.4rem;
      }

      .preview-lead {
        color: var(--preview-muted);
        font-size: var(--text-lg);
        line-height: var(--leading-body);
        margin: 0 0 1.25rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.7rem;
        margin-bottom: 1rem;
      }

      .stat,
      .card,
      .alert {
        background: var(--preview-surface);
        border: 1px solid var(--preview-border);
        border-radius: var(--radius-lg);
      }

      .stat {
        padding: 0.85rem 0.9rem;
      }

      .stat .label {
        color: var(--preview-muted);
        font-size: var(--text-xs);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .stat .value {
        font-family: var(--font-display);
        font-size: var(--text-2xl);
        font-weight: 700;
        margin-top: 0.15rem;
      }

      .card {
        padding: 1.15rem 1.2rem 1.25rem;
        margin-bottom: 0.9rem;
      }

      .card h3 {
        font-family: var(--font-display);
        font-size: var(--text-xl);
        margin: 0 0 0.4rem;
        font-weight: var(--weight-display);
      }

      .card p {
        margin: 0 0 0.9rem;
        color: var(--preview-muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .preview-root button.cta,
      .preview-root button.ghost,
      .preview-root button.danger {
        border: 0;
        border-radius: var(--radius-sm);
        padding: 0.5rem 0.9rem;
        font-weight: 650;
        font-size: var(--text-sm);
        cursor: default;
      }

      .preview-root button.cta {
        background: var(--preview-primary);
        color: var(--preview-on-primary);
      }

      .preview-root button.ghost {
        background: transparent;
        color: var(--preview-text);
        box-shadow: inset 0 0 0 1px var(--preview-border);
      }

      .preview-root button.danger {
        background: var(--preview-danger);
        color: #fff;
      }

      .alerts {
        display: grid;
        gap: 0.5rem;
        margin-top: 0.9rem;
      }

      .alert {
        padding: 0.7rem 0.85rem;
        font-size: var(--text-sm);
        border: 0;
      }

      .alert.info {
        background: var(--preview-primary-soft);
        color: var(--preview-primary-ink);
      }

      .alert.ok {
        background: var(--preview-success-soft);
        color: var(--preview-success-ink);
      }

      .alert.warn {
        background: var(--preview-warning-soft);
        color: var(--preview-warning-ink);
      }

      .alert.bad {
        background: var(--preview-danger-soft);
        color: var(--preview-danger-ink);
      }

      .form-grid {
        display: grid;
        gap: 0.65rem;
      }

      .form-grid label {
        display: grid;
        gap: 0.25rem;
        font-size: var(--text-sm);
        font-weight: 650;
      }

      .form-grid input,
      .form-grid select {
        border: 1px solid var(--preview-border);
        background: var(--preview-surface);
        color: var(--preview-text);
        border-radius: var(--radius-sm);
        padding: 0.5rem 0.6rem;
      }

      .type-page {
        background: var(--preview-surface);
        color: var(--preview-text);
        border-radius: 16px;
        padding: 1.5rem 1.6rem 2rem;
        border: 1px solid var(--ui-line);
        max-width: 52rem;
        margin: 0 auto;
      }

      .type-page .pair {
        color: var(--preview-muted);
        font-size: 0.8rem;
        margin: 0 0 1rem;
      }

      .type-row {
        display: grid;
        grid-template-columns: 5.5rem 1fr;
        gap: 0.8rem;
        padding: 0.7rem 0;
        border-top: 1px solid var(--preview-border);
        align-items: baseline;
      }

      .type-row .sz {
        color: var(--preview-muted);
        font-size: 0.75rem;
        font-family: ui-monospace, Menlo, monospace;
      }

      .type-row .sample-display {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        letter-spacing: var(--track-display);
        line-height: 1.2;
      }

      .type-row .sample-ui {
        font-family: var(--font-ui);
        line-height: var(--leading-body);
      }

      .components {
        max-width: 52rem;
        margin: 0 auto;
        display: grid;
        gap: 1rem;
      }

      .comp-block {
        background: var(--preview-surface);
        color: var(--preview-text);
        border: 1px solid var(--preview-border);
        border-radius: 14px;
        padding: 1rem 1.1rem;
      }

      .comp-block h3 {
        margin: 0 0 0.7rem;
        font-size: 0.85rem;
      }

      @media (max-width: 960px) {
        .workspace {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(18rem, 42vh) 1fr;
        }

        .swatch-row,
        .stats {
          grid-template-columns: repeat(5, 1fr);
        }

        .swatch .chip {
          height: 2.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <strong>Design System Studio</strong>
          <span>Build a palette and type scale, then preview it</span>
        </div>
        <nav class="topbar-tabs" id="inspectorTabs">
          <button type="button" data-tab="color" aria-selected="true">Palette</button>
          <button type="button" data-tab="type">Type</button>
          <button type="button" data-tab="space">Spacing</button>
          <button type="button" data-tab="export">Export</button>
        </nav>
        <div class="top-actions">
          <label class="btn" style="margin: 0; cursor: pointer">
            Import JSON
            <input id="importFile" type="file" accept=".json,application/json" hidden />
          </label>
          <button type="button" class="primary" id="downloadCss">Download CSS</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="inspector" id="inspector"></aside>
        <main class="stage">
          <div class="stage-head">
            <nav class="stage-tabs" id="stageTabs">
              <button type="button" data-stage="app" aria-selected="true">App preview</button>
              <button type="button" data-stage="palette">Color board</button>
              <button type="button" data-stage="type">Type specimen</button>
              <button type="button" data-stage="components">Components</button>
            </nav>
            <label class="check" style="margin: 0">
              <input type="checkbox" id="darkPreview" />
              Dark preview
            </label>
          </div>
          <div id="stageBody"></div>
          <p class="status" id="status" aria-live="polite"></p>
        </main>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "rui-studio-v4";
      const STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];

      const SCALE_ROLES = {
        primary: "Actions, links, nav, emphasis",
        neutral: "Text, surfaces, borders — most of the UI",
        accent: "Highlights that should stand out from primary",
        danger: "Destructive actions and errors",
        warning: "Caution, pending, attention",
        success: "Positive states and confirmation",
      };

      const UI_FONTS = [
        { id: "Inter", google: "Inter:wght@400;500;600;700;800" },
        { id: "Source Sans 3", google: "Source+Sans+3:wght@400;500;600;700;800" },
        { id: "IBM Plex Sans", google: "IBM+Plex+Sans:wght@400;500;600;700" },
        { id: "Lato", google: "Lato:wght@400;700;900" },
        { id: "Open Sans", google: "Open+Sans:wght@400;500;600;700;800" },
        { id: "Nunito Sans", google: "Nunito+Sans:wght@400;500;600;700;800" },
        { id: "DM Sans", google: "DM+Sans:wght@400;500;600;700" },
        { id: "Work Sans", google: "Work+Sans:wght@400;500;600;700;800" },
        { id: "Outfit", google: "Outfit:wght@400;500;600;700;800" },
        { id: "Figtree", google: "Figtree:wght@400;500;600;700;800" },
        { id: "Plus Jakarta Sans", google: "Plus+Jakarta+Sans:wght@400;500;600;700;800" },
        { id: "System UI", google: null },
      ];

      const DISPLAY_FONTS = [
        { id: "Fraunces", google: "Fraunces:wght@500;600;700" },
        { id: "Playfair Display", google: "Playfair+Display:wght@500;600;700;800" },
        { id: "Source Serif 4", google: "Source+Serif+4:wght@500;600;700" },
        { id: "Newsreader", google: "Newsreader:wght@500;600;700" },
        { id: "Libre Baskerville", google: "Libre+Baskerville:wght@400;700" },
        { id: "Instrument Serif", google: "Instrument+Serif:wght@400" },
        { id: "Space Grotesk", google: "Space+Grotesk:wght@500;600;700" },
        { id: "Syne", google: "Syne:wght@600;700;800" },
        { id: "Oswald", google: "Oswald:wght@500;600;700" },
        { id: "Bricolage Grotesque", google: "Bricolage+Grotesque:wght@500;600;700;800" },
        { id: "Sora", google: "Sora:wght@500;600;700" },
        ...UI_FONTS,
      ];

      const MONO_FONTS = [
        { id: "IBM Plex Mono", google: "IBM+Plex+Mono:wght@400;500;600" },
        { id: "JetBrains Mono", google: "JetBrains+Mono:wght@400;500;600;700" },
        { id: "Source Code Pro", google: "Source+Code+Pro:wght@400;500;600;700" },
        { id: "ui-monospace", google: null },
      ];

      const TYPE_SCALES = {
        rui: {
          name: "Fixed steps (12–48)",
          sizes: { xs: 12, sm: 14, base: 16, lg: 18, xl: 20, "2xl": 24, "3xl": 30, "4xl": 36, "5xl": 48 },
        },
        compact: {
          name: "Compact UI",
          sizes: { xs: 11, sm: 12, base: 14, lg: 16, xl: 18, "2xl": 20, "3xl": 24, "4xl": 30, "5xl": 36 },
        },
        editorial: {
          name: "Editorial",
          sizes: { xs: 12, sm: 14, base: 18, lg: 20, xl: 24, "2xl": 30, "3xl": 36, "4xl": 48, "5xl": 60 },
        },
      };

      const loadedFonts = new Set();

      function hueName(h) {
        const x = ((h % 360) + 360) % 360;
        if (x < 15 || x >= 345) return "Red";
        if (x < 40) return "Orange";
        if (x < 65) return "Yellow";
        if (x < 90) return "Lime";
        if (x < 150) return "Green";
        if (x < 175) return "Teal";
        if (x < 200) return "Cyan";
        if (x < 230) return "Blue";
        if (x < 255) return "Indigo";
        if (x < 290) return "Violet";
        if (x < 330) return "Magenta";
        return "Pink";
      }

      function clamp(n, a, b) {
        return Math.min(b, Math.max(a, n));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function ease(t) {
        return t * t * (3 - 2 * t);
      }

      function circularDelta(from, to) {
        return ((((to - from) % 360) + 540) % 360) - 180;
      }

      function rotateToward(from, to, amount) {
        const d = circularDelta(from, to);
        if (d === 0 || amount === 0) return from;
        const mag = Math.min(Math.abs(d), amount) * Math.sign(d);
        return (from + mag + 360) % 360;
      }

      function nearest(h, targets) {
        let best = targets[0];
        let bestAbs = Infinity;
        for (const t of targets) {
          const a = Math.abs(circularDelta(h, t));
          if (a < bestAbs) {
            bestAbs = a;
            best = t;
          }
        }
        return best;
      }

      function hslToRgb(h, s, l) {
        s /= 100;
        l /= 100;
        const c = (1 - Math.abs(2 * l - 1)) * s;
        const hp = ((h % 360) + 360) % 360 / 60;
        const x = c * (1 - Math.abs((hp % 2) - 1));
        let r = 0;
        let g = 0;
        let b = 0;
        if (hp < 1) [r, g, b] = [c, x, 0];
        else if (hp < 2) [r, g, b] = [x, c, 0];
        else if (hp < 3) [r, g, b] = [0, c, x];
        else if (hp < 4) [r, g, b] = [0, x, c];
        else if (hp < 5) [r, g, b] = [x, 0, c];
        else [r, g, b] = [c, 0, x];
        const m = l - c / 2;
        return [r, g, b].map((v) => Math.round((v + m) * 255));
      }

      function rgbToHex(r, g, b) {
        return (
          "#" +
          [r, g, b]
            .map((v) => clamp(v, 0, 255).toString(16).padStart(2, "0"))
            .join("")
            .toUpperCase()
        );
      }

      function hexToHsl(hex) {
        const n = hex.replace("#", "").trim();
        if (n.length !== 6 || /[^0-9a-f]/i.test(n)) return null;
        const r = parseInt(n.slice(0, 2), 16) / 255;
        const g = parseInt(n.slice(2, 4), 16) / 255;
        const b = parseInt(n.slice(4, 6), 16) / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const l = (max + min) / 2;
        let h = 0;
        let s = 0;
        if (max !== min) {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r:
              h = (g - b) / d + (g < b ? 6 : 0);
              break;
            case g:
              h = (b - r) / d + 2;
              break;
            default:
              h = (r - g) / d + 4;
          }
          h /= 6;
        }
        return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
      }

      function hexToRgb(hex) {
        const n = hex.replace("#", "");
        return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
      }

      function relLum(hex) {
        const [r, g, b] = hexToRgb(hex).map((c) => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      }

      function contrastRatio(a, b) {
        const l1 = relLum(a);
        const l2 = relLum(b);
        const hi = Math.max(l1, l2);
        const lo = Math.min(l1, l2);
        return (hi + 0.05) / (lo + 0.05);
      }

      function shadeT(step) {
        return STEPS.indexOf(step) / (STEPS.length - 1);
      }

      function generateScale(def) {
        return STEPS.map((step) => {
          if (def.overrides && def.overrides[step]) {
            const o = def.overrides[step];
            const hex = rgbToHex(...hslToRgb(o.h, o.s, o.l));
            return { step, h: o.h, s: o.s, l: o.l, hex, override: true };
          }
          const t = shadeT(step);
          let l;
          if (t <= 0.5) l = lerp(def.light50, def.light500, ease(t / 0.5));
          else l = lerp(def.light500, def.light900, ease((t - 0.5) / 0.5));
          const dist = Math.abs(t - 0.5) * 2;
          let s = def.sat500 - def.satDip * (1 - dist) + def.satBoost * dist ** 1.5;
          if (t > 0.5) s += def.satBoost * 0.2 * dist;
          s = clamp(s, 0, 100);
          l = clamp(l, 0, 100);
          let h = def.hue;
          if (t < 0.5) {
            h = rotateToward(def.hue, nearest(def.hue, [60, 180, 300]), def.hueRotate * (0.5 - t) * 2);
          } else if (t > 0.5) {
            h = rotateToward(def.hue, nearest(def.hue, [0, 120, 240]), def.hueRotate * (t - 0.5) * 2);
          }
          const hex = rgbToHex(...hslToRgb(h, s, l));
          return { step, h: Math.round(h), s: Math.round(s), l: Math.round(l), hex, override: false };
        });
      }

      function makeScale(partial) {
        return {
          name: partial.name,
          hue: 220,
          sat500: 64,
          light500: 48,
          light50: 96,
          light900: 16,
          hueRotate: 10,
          satBoost: 22,
          satDip: 8,
          overrides: {},
          ...partial,
        };
      }

      function defaultState() {
        return {
          inspectorTab: "color",
          stage: "app",
          selectedScale: "primary",
          selectedShade: 500,
          darkPreview: false,
          linkNeutrals: true,
          advancedOpen: false,
          scales: {
            primary: makeScale({ name: "Primary", hue: 221, sat500: 72, light500: 50, light50: 96, light900: 18 }),
            neutral: makeScale({
              name: "Neutrals",
              hue: 214,
              sat500: 18,
              light500: 48,
              light50: 97,
              light900: 15,
              hueRotate: 6,
              satBoost: 20,
              satDip: 4,
            }),
            accent: makeScale({ name: "Accent", hue: 280, sat500: 58, light500: 48, light50: 96, light900: 18 }),
            danger: makeScale({ name: "Danger", hue: 4, sat500: 72, light500: 48, light50: 96, light900: 18, hueRotate: 6 }),
            warning: makeScale({
              name: "Warning",
              hue: 38,
              sat500: 90,
              light500: 52,
              light50: 96,
              light900: 22,
              hueRotate: 12,
            }),
            success: makeScale({ name: "Success", hue: 162, sat500: 64, light500: 38, light50: 96, light900: 16 }),
          },
          type: {
            display: "Fraunces",
            ui: "Inter",
            mono: "IBM Plex Mono",
            weightDisplay: 600,
            weightUi: 400,
            scale: "rui",
            baseSize: 16,
            leading: 1.5,
            trackDisplay: -0.02,
          },
          space: {
            unit: 8,
            radiusSm: 6,
            radiusLg: 12,
          },
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          const base = defaultState();
          return {
            ...base,
            ...parsed,
            scales: { ...base.scales, ...(parsed.scales || {}) },
            type: { ...base.type, ...(parsed.type || {}) },
            space: { ...base.space, ...(parsed.space || {}) },
          };
        } catch {
          return defaultState();
        }
      }

      let state = loadState();
      const els = {
        inspector: document.getElementById("inspector"),
        stageBody: document.getElementById("stageBody"),
        status: document.getElementById("status"),
        importFile: document.getElementById("importFile"),
        darkPreview: document.getElementById("darkPreview"),
      };

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function allScales() {
        const out = {};
        for (const [id, def] of Object.entries(state.scales)) out[id] = generateScale(def);
        return out;
      }

      function fontStack(id) {
        if (id === "System UI") return 'system-ui, -apple-system, "Segoe UI", sans-serif';
        if (id === "ui-monospace") return 'ui-monospace, SFMono-Regular, Menlo, monospace';
        return `"${id}", system-ui, sans-serif`;
      }

      function ensureFont(id, list) {
        const rec = list.find((f) => f.id === id);
        if (!rec || !rec.google || loadedFonts.has(rec.google)) return;
        loadedFonts.add(rec.google);
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `https://fonts.googleapis.com/css2?family=${rec.google}&display=swap`;
        document.head.appendChild(link);
      }

      function typeSizes() {
        const preset = TYPE_SCALES[state.type.scale] || TYPE_SCALES.rui;
        const factor = (Number(state.type.baseSize) || 16) / 16;
        const out = {};
        for (const [k, v] of Object.entries(preset.sizes)) out[k] = +(v * factor).toFixed(2);
        return out;
      }

      function spacing() {
        const u = Number(state.space.unit) || 8;
        const keys = [0, 1, 2, 3, 4, 5, 6, 8, 10, 12];
        const mult = [0, 0.5, 1, 1.5, 2, 3, 4, 6, 8, 12];
        const out = {};
        keys.forEach((k, i) => {
          out[k] = mult[i] * u;
        });
        return out;
      }

      function pickOnColor(bg) {
        return contrastRatio(bg, "#FFFFFF") >= 4.5 ? "#FFFFFF" : contrastRatio(bg, "#102A43") >= 3 ? "#102A43" : "#000000";
      }

      function tokenMap() {
        const scales = allScales();
        const dark = state.darkPreview;
        const n = Object.fromEntries(scales.neutral.map((s) => [s.step, s]));
        const p = Object.fromEntries(scales.primary.map((s) => [s.step, s]));
        const d = Object.fromEntries(scales.danger.map((s) => [s.step, s]));
        const w = Object.fromEntries(scales.warning.map((s) => [s.step, s]));
        const g = Object.fromEntries(scales.success.map((s) => [s.step, s]));
        const a = Object.fromEntries(scales.accent.map((s) => [s.step, s]));
        const ts = typeSizes();
        const sp = spacing();
        const brand = p[600].hex;
        return {
          scales,
          ts,
          sp,
          preview: {
            bg: dark ? n[900].hex : n[50].hex,
            surface: dark ? n[800].hex : "#FFFFFF",
            text: dark ? n[50].hex : n[900].hex,
            muted: dark ? n[400].hex : n[600].hex,
            border: dark ? n[700].hex : n[200].hex,
            brand,
            brandText: pickOnColor(brand),
            primary: p[500].hex,
            onPrimary: pickOnColor(p[500].hex),
            primarySoft: p[100].hex,
            primaryInk: p[800].hex,
            danger: d[500].hex,
            dangerSoft: d[100].hex,
            dangerInk: d[800].hex,
            warningSoft: w[100].hex,
            warningInk: w[800].hex,
            successSoft: g[100].hex,
            successInk: g[800].hex,
            accent: a[500].hex,
          },
        };
      }

      function cssText() {
        const { scales, ts, sp } = tokenMap();
        const lines = [":root {"];
        for (const [id, shades] of Object.entries(scales)) {
          for (const s of shades) lines.push(`  --color-${id}-${s.step}: ${s.hex};`);
          lines.push("");
        }
        lines.push(`  --font-display: ${fontStack(state.type.display)};`);
        lines.push(`  --font-ui: ${fontStack(state.type.ui)};`);
        lines.push(`  --font-mono: ${fontStack(state.type.mono)};`);
        lines.push(`  --weight-display: ${state.type.weightDisplay};`);
        lines.push(`  --weight-ui: ${state.type.weightUi};`);
        lines.push(`  --track-display: ${state.type.trackDisplay}em;`);
        lines.push(`  --leading-body: ${state.type.leading};`);
        for (const [k, v] of Object.entries(ts)) lines.push(`  --text-${k}: ${v}px;`);
        lines.push("");
        for (const [k, v] of Object.entries(sp)) lines.push(`  --space-${k}: ${v}px;`);
        lines.push(`  --radius-sm: ${state.space.radiusSm}px;`);
        lines.push(`  --radius-lg: ${state.space.radiusLg}px;`);
        lines.push(`  --radius-full: 999px;`);
        lines.push(`  --shadow-sm: 0 1px 2px hsl(0 0% 0% / 6%), 0 1px 3px hsl(0 0% 0% / 8%);`);
        lines.push(`  --shadow-md: 0 4px 6px hsl(0 0% 0% / 8%), 0 2px 4px hsl(0 0% 0% / 6%);`);
        lines.push("}");
        return lines.join("\n");
      }

      function jsonText() {
        const scales = allScales();
        const obj = {};
        for (const [id, shades] of Object.entries(scales)) {
          const key = state.scales[id].name.toLowerCase().replace(/\s+/g, "-");
          for (const s of shades) {
            const step = String(s.step).padStart(3, "0");
            obj[`${key}-${step}`] = s.hex;
          }
        }
        return JSON.stringify(obj, null, 2);
      }

      function applyPreviewVars(root, tokens) {
        if (!root) return;
        const p = tokens.preview;
        const set = (k, v) => root.style.setProperty(k, v);
        set("--preview-bg", p.bg);
        set("--preview-surface", p.surface);
        set("--preview-text", p.text);
        set("--preview-muted", p.muted);
        set("--preview-border", p.border);
        set("--preview-brand", p.brand);
        set("--preview-brand-text", p.brandText);
        set("--preview-primary", p.primary);
        set("--preview-on-primary", p.onPrimary);
        set("--preview-primary-soft", p.primarySoft);
        set("--preview-primary-ink", p.primaryInk);
        set("--preview-danger", p.danger);
        set("--preview-danger-soft", p.dangerSoft);
        set("--preview-danger-ink", p.dangerInk);
        set("--preview-warning-soft", p.warningSoft);
        set("--preview-warning-ink", p.warningInk);
        set("--preview-success-soft", p.successSoft);
        set("--preview-success-ink", p.successInk);
        set("--font-display", fontStack(state.type.display));
        set("--font-ui", fontStack(state.type.ui));
        set("--weight-display", state.type.weightDisplay);
        set("--weight-ui", state.type.weightUi);
        set("--track-display", `${state.type.trackDisplay}em`);
        set("--leading-body", state.type.leading);
        for (const [k, v] of Object.entries(tokens.ts)) set(`--text-${k}`, `${v}px`);
        set("--radius-sm", `${state.space.radiusSm}px`);
        set("--radius-lg", `${state.space.radiusLg}px`);
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function optionList(list, selected) {
        return list
          .map((f) => `<option value="${esc(f.id)}" ${f.id === selected ? "selected" : ""}>${esc(f.id)}</option>`)
          .join("");
      }

      function currentScale() {
        return state.scales[state.selectedScale];
      }

      function renderInspector() {
        const tab = state.inspectorTab;
        if (tab === "color") renderColorInspector();
        else if (tab === "type") renderTypeInspector();
        else if (tab === "space") renderSpaceInspector();
        else renderExportInspector();
      }

      function miniRamp(id) {
        const shades = generateScale(state.scales[id]);
        return `<div class="mini-ramp">${shades.map((s) => `<span style="background:${s.hex}"></span>`).join("")}</div>`;
      }

      function satBg(def) {
        return `linear-gradient(to right, hsl(${def.hue} 0% ${def.light500}%), hsl(${def.hue} 100% ${def.light500}%))`;
      }

      function lightBg(def) {
        return `linear-gradient(to right, hsl(${def.hue} ${def.sat500}% 0%), hsl(${def.hue} ${def.sat500}% 50%), hsl(${def.hue} ${def.sat500}% 100%))`;
      }

      function renderColorInspector() {
        const id = state.selectedScale;
        const def = currentScale();
        const shades = generateScale(def);
        const base = shades.find((s) => s.step === 500);
        const ratio = contrastRatio(base.hex, "#FFFFFF");
        const pass = ratio >= 4.5;
        const override = def.overrides[state.selectedShade];
        const editing = shades.find((s) => s.step === state.selectedShade) || base;
        els.inspector.innerHTML = `
          <p class="hint">Pick a scale, then set hue / saturation / lightness yourself. The ramp is 10 shades (50–900). 500 should work as a button.</p>
          <div class="scale-list">
            ${Object.keys(state.scales)
              .map(
                (key) => `
              <button type="button" class="scale-btn" data-select-scale="${key}" aria-pressed="${key === id}">
                <div class="row-name">${esc(state.scales[key].name)} <em>${hueName(state.scales[key].hue)}</em></div>
                ${miniRamp(key)}
              </button>`,
              )
              .join("")}
          </div>
          <label class="field-label" for="scaleName">Scale name</label>
          <input type="text" id="scaleName" data-scale-field="name" value="${esc(def.name)}" />
          <p class="hint" style="margin-top:0.45rem">${esc(SCALE_ROLES[id] || "")}</p>

          <div class="field">
            <div class="field-label">Hue <span>${Math.round(def.hue)}° · ${hueName(def.hue)}</span></div>
            <div class="slider-row">
              <input class="hue-range" type="range" min="0" max="360" step="1" data-scale-field="hue" value="${def.hue}" />
              <input type="number" min="0" max="360" data-scale-field="hue" value="${def.hue}" />
            </div>
          </div>
          <div class="field">
            <div class="field-label">Base saturation (500) <span>${Math.round(def.sat500)}%</span></div>
            <div class="slider-row">
              <input type="range" min="0" max="100" step="1" data-scale-field="sat500" value="${def.sat500}" style="background:${satBg(def)}; appearance:none; height:12px; border-radius:99px;" />
              <input type="number" min="0" max="100" data-scale-field="sat500" value="${def.sat500}" />
            </div>
          </div>
          <div class="field">
            <div class="field-label">Base lightness (500) <span>${Math.round(def.light500)}%</span></div>
            <div class="slider-row">
              <input type="range" min="8" max="80" step="1" data-scale-field="light500" value="${def.light500}" style="background:${lightBg(def)}; appearance:none; height:12px; border-radius:99px;" />
              <input type="number" min="8" max="80" data-scale-field="light500" value="${def.light500}" />
            </div>
          </div>
          <div class="field">
            <div class="field-label">500 hex</div>
            <div class="hex-row">
              <input type="color" id="baseColor" value="${base.hex.toLowerCase()}" />
              <input type="text" id="baseHex" value="${base.hex}" spellcheck="false" />
              <span class="contrast ${pass ? "pass" : "fail"}">White ${ratio.toFixed(1)}:1 ${pass ? "AA" : "fail"}</span>
            </div>
          </div>

          <div class="field">
            <div class="field-label">Lightest (50) <span>${Math.round(def.light50)}%</span></div>
            <div class="slider-row">
              <input type="range" min="80" max="99" step="1" data-scale-field="light50" value="${def.light50}" />
              <input type="number" min="80" max="99" data-scale-field="light50" value="${def.light50}" />
            </div>
          </div>
          <div class="field">
            <div class="field-label">Darkest (900) <span>${Math.round(def.light900)}%</span></div>
            <div class="slider-row">
              <input type="range" min="4" max="36" step="1" data-scale-field="light900" value="${def.light900}" />
              <input type="number" min="4" max="36" data-scale-field="light900" value="${def.light900}" />
            </div>
          </div>

          <div class="section-title" id="shadeEditor">Tweak one shade</div>
          <p class="hint">Click a swatch on the color board, or pick a step below. Manual HSL on a shade sticks until you move the main hue/sat/light sliders.</p>
          <div class="shade-picks">
            ${shades
              .map(
                (s) => `<button type="button" data-pick-shade="${s.step}" aria-pressed="${state.selectedShade === s.step}"><span class="dot" style="background:${s.hex}"></span>${s.step}</button>`,
              )
              .join("")}
          </div>
          <div class="field">
            <div class="field-label">Shade ${editing.step} hue <span>${editing.h}°</span></div>
            <div class="slider-row">
              <input class="hue-range" type="range" min="0" max="360" data-shade-field="h" value="${editing.h}" />
              <input type="number" min="0" max="360" data-shade-field="h" value="${editing.h}" />
            </div>
          </div>
          <div class="field">
            <div class="field-label">Saturation <span>${editing.s}%</span></div>
            <div class="slider-row">
              <input type="range" min="0" max="100" data-shade-field="s" value="${editing.s}" />
              <input type="number" min="0" max="100" data-shade-field="s" value="${editing.s}" />
            </div>
          </div>
          <div class="field">
            <div class="field-label">Lightness <span>${editing.l}%</span></div>
            <div class="slider-row">
              <input type="range" min="0" max="100" data-shade-field="l" value="${editing.l}" />
              <input type="number" min="0" max="100" data-shade-field="l" value="${editing.l}" />
            </div>
          </div>
          <p class="hint">${override ? "This shade is a manual override." : "Generated from the ramp."} ${editing.hex} · hsl(${editing.h}, ${editing.s}%, ${editing.l}%)</p>

          <details class="advanced" ${state.advancedOpen ? "open" : ""}>
            <summary>Ramp curve (hue rotation &amp; saturation)</summary>
            <div class="field">
              <div class="field-label">Hue rotation <span>${def.hueRotate}°</span></div>
              <div class="slider-row">
                <input type="range" min="0" max="30" step="1" data-scale-field="hueRotate" value="${def.hueRotate}" />
                <input type="number" min="0" max="30" data-scale-field="hueRotate" value="${def.hueRotate}" />
              </div>
              <p class="hint">Light shades rotate toward yellow/cyan; dark shades toward red/blue. Keep it under ~30° so it still reads as one color.</p>
            </div>
            <div class="field">
              <div class="field-label">End saturation boost <span>${def.satBoost}</span></div>
              <div class="slider-row">
                <input type="range" min="0" max="40" step="1" data-scale-field="satBoost" value="${def.satBoost}" />
                <input type="number" min="0" max="40" data-scale-field="satBoost" value="${def.satBoost}" />
              </div>
            </div>
            <div class="field">

      function parseRuiJson(text) {
        const stripped = text
          .replace(/^\s*\/\/.*$/gm, "")
          .replace(/,\s*([}\]])/g, "$1");
        return JSON.parse(stripped);
      }

      function importPalette(obj) {
        const groups = {};
        for (const [key, hex] of Object.entries(obj)) {
          const m = String(key).match(/^(.+)-(\d{3}|\d{2})$/);
          if (!m) continue;
          const step = Number(m[2] === "050" ? 50 : m[2]);
          if (!STEPS.includes(step)) continue;
          const hsl = hexToHsl(String(hex));
          if (!hsl) continue;
          groups[m[1]] ||= {};
          groups[m[1]][step] = { hex: String(hex).toUpperCase(), ...hsl };
        }
        const names = Object.keys(groups);
        if (!names.length) throw new Error("no scales");
        const isGrey = (n) => /grey|gray|neutral/i.test(n);
        const isRed = (n) => /red|danger|error/i.test(n);
        const isYellow = (n) => /yellow|orange|warning|amber/i.test(n);
        const isGreen = (n) => /green|teal|success|lime/i.test(n);
        const grey = names.find(isGrey);
        const red = names.find(isRed);
        const yellow = names.find(isYellow);
        const green = names.find(isGreen);
        const primary = names.find((n) => n !== grey && n !== red && n !== yellow && n !== green) || names[0];
        const accent = names.find((n) => ![grey, red, yellow, green, primary].includes(n));
        const mapping = {
          primary,
          neutral: grey || primary,
          accent: accent || primary,
          danger: red || primary,
          success: green || primary,
          warning: yellow || primary,
        };
        for (const [role, src] of Object.entries(mapping)) {
          if (!src || !groups[src]) continue;
          const g = groups[src];
          const mid = g[500] || g[400] || Object.values(g)[0];
          const light = g[50] || g[100];
          const dark = g[900] || g[800];
          const overrides = {};
          for (const step of STEPS) {
            if (g[step]) overrides[step] = { h: g[step].h, s: g[step].s, l: g[step].l };
          }
          state.scales[role] = makeScale({
            name: src.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()),
            hue: mid.h,
            sat500: mid.s,
            light500: clamp(mid.l, 8, 80),
            light50: light ? light.l : 96,
            light900: dark ? dark.l : 16,
            overrides,
          });
        }
        state.linkNeutrals = false;
        state.stage = "palette";
        document.querySelectorAll("#stageTabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.stage === "palette" ? "true" : "false"));
      }

      els.importFile.addEventListener("change", async () => {
        const file = els.importFile.files?.[0];
        if (!file) return;
        try {
          importPalette(parseRuiJson(await file.text()));
          els.status.textContent = `Loaded ${file.name}. Shades are exact; moving a hue slider rebuilds that ramp.`;
          fullColorRefresh();
        } catch {
          els.status.textContent = "Could not read that file. Use a palette-XX.json from the Color Palettes JSON folder.";
        }
        els.importFile.value = "";
      });

      function download(text, name, type) {
        const blob = new Blob([text], { type });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
        els.status.textContent = `Saved ${name}.`;
      }

      document.getElementById("downloadCss").addEventListener("click", () => {
        download(cssText(), "tokens.css", "text/css");
      });

      function initTabs() {
        document.querySelectorAll("#inspectorTabs button").forEach((b) => {
          b.setAttribute("aria-selected", b.dataset.tab === state.inspectorTab ? "true" : "false");
        });
        document.querySelectorAll("#stageTabs button").forEach((b) => {
          b.setAttribute("aria-selected", b.dataset.stage === state.stage ? "true" : "false");
        });
        els.darkPreview.checked = state.darkPreview;
      }

      ensureFont("Inter", UI_FONTS);
      initTabs();
      renderInspector();
      renderStage();
    </script>
  </body>
</html>
